name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Download dependencies
        run: flutter pub get

      - name: Repair Android project structure
        run: |
          flutter create --platforms=android --org com.emuhub .
          # flutter create 会生成引用模板 MyApp 的测试；本项目已有自己的测试套件。
          rm -f test/widget_test.dart
          # 恢复项目自定义的 Gradle、清单与 Kotlin 配置。
          git checkout android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties
          git checkout android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/
          if [ ! -f android/gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin -p android
          fi
          chmod +x android/gradlew

      - name: Prepare fixed release signing
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/emuhub-release.p12
          test -s android/app/emuhub-release.p12

      - name: Generate code (freezed / json_serializable / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        # versionCode 随 run_number 递增，否则所有 Release 的 versionCode 恒为 1，
        # 用户无法以“新版本”覆盖安装
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/emuhub-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Verify fixed release signing certificate
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          expected=$(tr -d '[:space:]:' < android/signing-certificate.sha256 | tr 'A-F' 'a-f')
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          actual=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr 'A-F' 'a-f')
          test -n "$actual"
          echo "Expected release signing certificate SHA-256: $expected"
          echo "Actual APK signing certificate SHA-256: $actual"
          test "$actual" = "$expected"
          echo "Verified release signing certificate SHA-256: $actual"

      - name: Remove decoded signing key
        if: always()
        run: |
          if [ -f android/app/emuhub-release.p12 ]; then
            shred -u android/app/emuhub-release.p12 || rm -f android/app/emuhub-release.p12
          fi

      - name: List build output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emuhub-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EmuHub v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
