name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter version
        run: flutter --version

      - name: Download dependencies
        run: flutter pub get

      - name: Repair Android project structure
        run: |
          flutter create --platforms=android --org com.emuhub .
          # 恢复自定义配置（flutter create 会覆盖 gradle 文件、清单与 Kotlin 代码）
          git checkout android/settings.gradle.kts android/build.gradle.kts android/app/build.gradle.kts android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties
          git checkout android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/
          # 若 gradlew 缺失则通过系统 gradle 生成 wrapper
          if [ ! -f android/gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin -p android || true
          fi
          chmod +x android/gradlew

      - name: Generate code (freezed / json_serializable / drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        # versionCode 随 run_number 递增，否则所有 Release 的 versionCode 恒为 1，
        # 用户无法以“新版本”覆盖安装
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: List build output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emuhub-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EmuHub v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
