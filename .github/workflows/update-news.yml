name: Update Chinese News Feed

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

concurrency:
  group: news-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate translated news feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: openai/gpt-4.1
        run: python3 scripts/update_news_feed.py

      - name: Validate feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [Path('assets/news.json'), Path('data/news.json')]
          payloads = [json.loads(path.read_text(encoding='utf-8')) for path in paths]
          assert payloads[0] == payloads[1]
          payload = payloads[0]
          assert payload['schemaVersion'] == 1
          assert payload['retentionDays'] == 90
          assert payload['source']['feedUrl'] == 'https://www.emu-france.com/flux/rss/'
          articles = payload['articles']
          assert len(articles) >= 5
          assert len({item['id'] for item in articles}) == len(articles)
          android_releases = [
              item for item in articles
              if item['id'].startswith('android-release-')
          ]
          assert len(android_releases) >= 10
          for item in articles:
              assert item['title'] and item['content'] and item['publishedAt']
              assert item['title'].startswith('【')
              if item['id'].startswith('android-release-'):
                  assert item['category'] == 'android_update'
                  assert item['platforms'] == ['android']
                  assert item['relatedEmulatorIds']
                  assert '官方更新说明（中文）：' in item['content']
                  assert '官方更新说明（原文）：' not in item['content']
                  assert item['originalContent']
              else:
                  assert item['sourceUrl'].startswith('https://www.emu-france.com/news/')
          PY

      - name: Commit updated feed
        run: |
          if git diff --quiet -- assets/news.json data/news.json; then
            echo 'News feed is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/news.json data/news.json
          git commit -m '自动刷新中文模拟器新闻 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
