name: Fetch Lemuroid Version Info

# 拉取 Swordfish90/Lemuroid 最新 Release 版本信息并显示
# 对应截图2中 GitHub Releases 页面的版本信息

on:
  schedule:
    - cron: '0 6 * * *'    # 每天 UTC 06:00 自动检查
  workflow_dispatch: {}     # 支持手动触发

jobs:
  fetch-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要写权限以提交版本缓存文件

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Lemuroid latest release info
        id: fetch
        run: |
          set -euo pipefail

          OWNER="Swordfish90"
          REPO="Lemuroid"
          API_BASE="https://api.github.com/repos/$OWNER/$REPO"

          echo "::group::Fetching latest release from $OWNER/$REPO"

          # 获取最新 release 信息
          RELEASE=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_BASE/releases/latest")

          # 提取字段
          TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          NAME=$(echo "$RELEASE" | jq -r '.name')
          PUBLISHED_AT=$(echo "$RELEASE" | jq -r '.published_at')
          AUTHOR=$(echo "$RELEASE" | jq -r '.author.login')
          HTML_URL=$(echo "$RELEASE" | jq -r '.html_url')
          BODY=$(echo "$RELEASE" | jq -r '.body // "无更新说明"')
          IS_PRERELEASE=$(echo "$RELEASE" | jq -r '.prerelease')
          IS_LATEST=$(echo "$RELEASE" | jq -r '.draft')

          # 格式化发布日期 (ISO -> YYYY-MM-DD)
          PUBLISH_DATE=$(echo "$PUBLISHED_AT" | cut -dT -f1)

          # 获取 tag 对应的 commit SHA
          TAG_REF=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "$API_BASE/git/refs/tags/$TAG")
          COMMIT_SHA_FULL=$(echo "$TAG_REF" | jq -r '.object.sha')
          COMMIT_SHA=$(echo "$COMMIT_SHA_FULL" | cut -c1-7)

          # 获取 commit 的提交日期
          COMMIT_INFO=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "$API_BASE/commits/$COMMIT_SHA_FULL")
          COMMIT_DATE=$(echo "$COMMIT_INFO" | jq -r '.commit.committer.date' | cut -dT -f1)

          # 提取 APK 下载链接
          APK_URL=$(echo "$RELEASE" | jq -r \
            '.assets[] | select(.name | test("\\.apk$"; "i")) | .browser_download_url' \
            | head -1)
          APK_URL="${APK_URL:-无APK资源}"

          echo "::endgroup::"

          # 输出到 step outputs 供后续步骤使用
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "publish_date=$PUBLISH_DATE" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "html_url=$HTML_URL" >> $GITHUB_OUTPUT
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

          # 将 BODY 保存到文件（多行文本无法直接放 output）
          echo "$BODY" > /tmp/release_notes.txt

          # =====================================================
          # 在 Actions 运行页面显示版本信息（对应截图2的内容）
          # =====================================================
          {
            echo "## 📋 Lemuroid 版本信息"
            echo ""
            echo "> 数据来源: [$OWNER/$REPO Releases]($HTML_URL)"
            echo ""
            echo "| 字段 | 值 |"
            echo "|------|-----|"
            echo "| 版本号 | **$TAG** |"
            echo "| 发布状态 | ✅ Latest |"
            echo "| 发布者 | [$AUTHOR](https://github.com/$AUTHOR) |"
            echo "| 发布日期 | $PUBLISH_DATE |"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | [\`$COMMIT_SHA\`]($API_BASE/commit/$COMMIT_SHA_FULL) |"
            echo "| 提交日期 | $COMMIT_DATE |"
            echo "| APK 下载 | $APK_URL |"
            echo ""
            echo "### 📝 更新日志 (Release Notes)"
            echo ""
            echo '```markdown'
            cat /tmp/release_notes.txt
            echo '```'
            echo ""
            echo "### 📦 Release Assets"
            echo ""
            echo "| 文件名 | 大小 | 下载次数 | 下载链接 |"
            echo "|--------|------|----------|----------|"
            echo "$RELEASE" | jq -r \
              '.assets[] | "| \(.name) | \((.size / 1048576 * 100 | floor) / 100) MB | \(.download_count) | [下载](\(.browser_download_url)) |"'
            echo ""
            echo "---"
            echo "_⏰ 检查时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_"
          } >> $GITHUB_STEP_SUMMARY

          echo "✅ 版本信息已获取并显示在 Summary 中"

      - name: Save version cache JSON
        run: |
          mkdir -p assets/version_cache

          TAG="${{ steps.fetch.outputs.tag }}"
          PUBLISH_DATE="${{ steps.fetch.outputs.publish_date }}"
          AUTHOR="${{ steps.fetch.outputs.author }}"
          COMMIT_SHA="${{ steps.fetch.outputs.commit_sha }}"
          COMMIT_DATE="${{ steps.fetch.outputs.commit_date }}"
          HTML_URL="${{ steps.fetch.outputs.html_url }}"
          APK_URL="${{ steps.fetch.outputs.apk_url }}"
          NOTES=$(cat /tmp/release_notes.txt)

          # 生成版本缓存 JSON（供 App 离线时回退使用）
          jq -n \
            --arg emulatorId "lemuroid" \
            --arg version "$TAG" \
            --arg releaseDate "$PUBLISH_DATE" \
            --arg releaseNotes "$NOTES" \
            --arg author "$AUTHOR" \
            --arg commitSha "$COMMIT_SHA" \
            --arg commitDate "$COMMIT_DATE" \
            --arg htmlUrl "$HTML_URL" \
            --arg downloadUrl "$APK_URL" \
            --arg fetchedAt "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              emulatorId: $emulatorId,
              version: $version,
              releaseDate: $releaseDate,
              releaseNotes: $releaseNotes,
              author: $author,
              commitSha: $commitSha,
              commitDate: $commitDate,
              htmlUrl: $htmlUrl,
              downloadUrl: $downloadUrl,
              fetchedAt: $fetchedAt
            }' > assets/version_cache/lemuroid.json

          echo "✅ 版本缓存已保存到 assets/version_cache/lemuroid.json"
          cat assets/version_cache/lemuroid.json

      - name: Commit version cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/version_cache/lemuroid.json

          if git diff --cached --quiet; then
            echo "ℹ️ 版本信息无变化，跳过提交"
          else
            git commit -m "chore: update Lemuroid version cache to ${{ steps.fetch.outputs.tag }}"
            git push
            echo "✅ 已提交版本缓存更新"
          fi
