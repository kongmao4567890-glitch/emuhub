name: emuhub
description: 模拟器资讯与更新追踪 App - 覆盖从 Atari 到 Switch 的全世代主机模拟器
publish_to: 'none'
version: 1.0.12+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.5.0+1

  # 数据库
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # 存储
  shared_preferences: ^2.3.2

  # 后台任务
  workmanager: ^0.9.0

  # 本地通知
  flutter_local_notifications: ^17.2.2

  # HTML 解析
  html: ^0.15.4

  # JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8

  # 工具
  intl: ^0.19.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 代码生成
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/emulators.json
    - assets/consoles/
    - assets/emulators/
